plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ebookwala.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.ebookwala.app"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Change this if your book catalog URL ever moves.
        buildConfigField "String", "BOOKS_JSON_URL", '"https://ebookwala.github.io/books.json"'
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Debug-signed so CI can produce an installable APK without secrets.
            signingConfig signingConfigs.debug
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.2'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'

    // Push notifications (new-book/offer alerts). The library compiles fine
    // without app/google-services.json; it only needs that file (and the
    // google-services plugin below) to actually initialize at runtime, which
    // NotificationHelper.kt guards against with a try/catch either way.
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-messaging-ktx'
}

// The google-services plugin hard-fails the build if google-services.json is
// missing, which would break CI (.github/workflows/build-apk.yml) before the
// file is added. Applying it only when the file exists keeps APK builds
// green either way — notifications simply activate once it's added.
if (project.file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}
