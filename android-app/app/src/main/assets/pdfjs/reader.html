<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=4.0, user-scalable=yes" />
<title>Reader</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #e6e8e6;
    height: 100%;
    overflow: hidden;
    font-family: sans-serif;
  }
  #viewer {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 56px;
    overflow: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: pan-x pan-y pinch-zoom;
  }
  #pageCanvas {
    background: #ffffff;
    box-shadow: 0 1px 6px rgba(0,0,0,0.25);
    max-width: 100%;
  }
  #controls {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 56px;
    background: #2C7A4B;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px;
    box-sizing: border-box;
  }
  .btn {
    background: #ffffff22;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 16px;
    font-weight: bold;
  }
  .btn:disabled {
    opacity: 0.4;
  }
  #pageInfo {
    color: #fff;
    font-size: 14px;
  }
  #status {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #555;
    font-size: 15px;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
</style>
</head>
<body>
  <div id="status">Book load ho rahi hai…</div>
  <div id="viewer" style="display:none;">
    <canvas id="pageCanvas"></canvas>
  </div>
  <div id="controls" style="display:none;">
    <button class="btn" id="prevBtn">&#8592; Prev</button>
    <span id="pageInfo"></span>
    <button class="btn" id="nextBtn">Next &#8594;</button>
  </div>

  <script type="module" src="reader.js"></script>
</body>
</html>
